[workspace]
members = ["src-tauri", "crates/*"]
resolver = "2"

# ─── 개발 빌드 속도 최적화 ──────────────────────────────────────────────
# 적용 직후 1회는 전체 재컴파일이 일어나며, 이후 증분 빌드와 링크가 빨라진다.
[profile.dev]
# 전체 디버그 심볼(2) 대신 라인 테이블만 생성 → 링크 시간·디스크 사용량 감소
debug = 1

# 외부 의존성은 한 번만 컴파일되어 캐시되므로, 최적화해도 반복 빌드 속도에는 영향이 없고
# 런타임(이미지/압축/폰트 처리 등) 성능만 향상된다.
[profile.dev.package."*"]
opt-level = 2

# 이미지 처리(픽셀화·리사이즈·배경 제거)는 전부 quickfolder-core 에 있다. 최적화 없이 돌리면
# 같은 연산이 릴리스 대비 10배 가까이 느려서, `tauri dev` 로 확인할 때 미리보기·저장이
# 체감될 만큼 밀리고 성능 판단 자체가 빗나간다. 이 크레이트만 최적화해 컴파일한다.
#
# opt-level 1 을 쓰는 이유 (2048x1536 픽셀화 기준 실측):
#   0 → 미리보기 300ms / 저장 810ms,  증분 빌드 1.8s
#   1 → 미리보기  29ms / 저장  92ms,  증분 빌드 7.5s   ← 거의 릴리스 수준
#   2 → 1 과 차이가 크지 않은데 증분 빌드만 13.7s
# (src-tauri 는 자주 고치는 글루 코드라 0 으로 둬 증분 빌드 속도를 지킨다.)
[profile.dev.package.quickfolder-core]
opt-level = 1
