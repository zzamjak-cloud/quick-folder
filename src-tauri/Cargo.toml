[package]
name = "app"
version = "1.27.78"
description = "A Tauri App"
authors = ["zzamjak-cloud"]
license = "GPL-3.0-only"
repository = "https://github.com/zzamjak-cloud/quick-folder"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }


[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
quickfolder-core = { path = "../crates/quickfolder-core" }
arboard = "3"
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
base64 = "0.22"
trash = "5"
psd = "0.3"
tauri-plugin-drag = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
hwarang = { version = "0.2", default-features = false }
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ureq = { version = "3", default-features = true }
ffmpeg-sidecar = "2"
ico = "0.3"
icns = "0.3"
ttf-parser = "0.24"
dirs = "6.0.0"
# 흰 화면 복구 이력의 사람이 읽을 수 있는 시각 표기용 (이미 의존성 트리에 있음)
chrono = "0.4"
filetime = "0.2"
lopdf = "0.36.0"

[dev-dependencies]
tauri = { version = "2.10", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
xattr = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "wingdi", "winuser", "combaseapi", "objbase", "winerror", "winbase", "winreg", "unknwnbase"] }
