[package]
name = "quickfolder-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-only"
description = "QuickFolder 배치 CLI"

[[bin]]
name = "qf"
path = "src/main.rs"

[dependencies]
quickfolder-core = { path = "../quickfolder-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
