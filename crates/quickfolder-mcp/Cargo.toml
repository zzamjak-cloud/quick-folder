[package]
name = "quickfolder-mcp"
version = "0.1.0"
edition = "2021"
# rmcp 3.x가 요구하는 최신 MSRV. 코어·앱은 1.77.2를 유지한다.
rust-version = "1.85"
license = "GPL-3.0-only"
description = "QuickFolder MCP 서버"

[[bin]]
name = "qf-mcp"
path = "src/main.rs"

[dependencies]
quickfolder-core = { path = "../quickfolder-core" }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
