[package]
name = "quickfolder-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-only"
description = "QuickFolder 파일·이미지·미디어 처리 코어 (GUI 비의존)"

[lib]
name = "quickfolder_core"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
base64 = "0.22"
trash = "5"
psd = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
hwarang = { version = "0.2", default-features = false }
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ureq = { version = "3", default-features = true }
ffmpeg-sidecar = "2"
ico = "0.3"
icns = "0.3"
ttf-parser = "0.24"
dirs = "6.0.0"
chrono = "0.4"
filetime = "0.2"
lopdf = "0.36.0"
toml_edit = "0.25.5"
# AI 배경 제거: ONNX Runtime 은 링크하지 않고 런타임에 내려받은 dylib 를 동적 로드한다
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
xattr = "1"
# AI 배경 제거 런타임(.tgz) 압축 해제
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "wingdi", "winuser", "combaseapi", "objbase", "winerror", "winbase", "winreg", "unknwnbase"] }
